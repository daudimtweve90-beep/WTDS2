<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TTSS Professional Editor</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#08090b;
  color:#fff;
  font-family:Arial,sans-serif;
}

button{
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* TOP */

.top{
  height:56px;
  min-height:56px;
  background:#101216;
  border-bottom:1px solid #252930;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
}

.top button{
  width:42px;
  height:42px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:#fff;
  font-size:20px;
}

.top button:active{
  background:#292e35;
}

.title{
  font-size:15px;
  font-weight:bold;
}

.subtitle{
  color:#777;
  font-size:9px;
  margin-top:2px;
}

/* WORKSPACE */

.workspace{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
  radial-gradient(circle,#20242a,#0a0b0d 75%);
  touch-action:none;
}

.grid{
  position:absolute;
  inset:0;
  opacity:.07;
  background-image:
  linear-gradient(#fff 1px,transparent 1px),
  linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:25px 25px;
}

#canvas{
  position:relative;
  width:min(94vw,900px);
  aspect-ratio:16/9;
  background:#252a30;
  box-shadow:0 20px 70px #000;
  transform-origin:center;
  touch-action:none;
}

#design{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.zoom{
  position:absolute;
  left:10px;
  bottom:10px;
  background:#0009;
  padding:7px 10px;
  border-radius:9px;
  font-size:10px;
  color:#aaa;
}

/* BOTTOM */

.bottom{
  background:#101216;
  border-top:1px solid #252930;
}

.panel{
  max-height:0;
  overflow:hidden;
  transition:.2s;
  background:#15181d;
}

.panel.open{
  max-height:220px;
  overflow-y:auto;
}

.panel-inner{
  padding:12px;
}

.panel-title{
  font-size:12px;
  font-weight:bold;
  margin-bottom:9px;
}

.tools{
  height:72px;
  display:flex;
  overflow-x:auto;
  gap:4px;
  padding:7px;
}

.tools::-webkit-scrollbar{
  display:none;
}

.tool{
  min-width:64px;
  height:58px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
}

.tool b{
  font-size:21px;
}

.tool:active{
  background:#292e35;
  color:#00d26a;
}

.row{
  display:flex;
  gap:7px;
  overflow-x:auto;
}

.btn{
  flex:0 0 auto;
  border:1px solid #353a42;
  background:#22262d;
  color:#fff;
  border-radius:10px;
  padding:10px 13px;
  font-size:11px;
}

.btn:active{
  transform:scale(.96);
}

input[type=text]{
  width:100%;
  background:#0b0d10;
  color:#fff;
  border:1px solid #353a42;
  border-radius:10px;
  padding:12px;
  outline:none;
  margin-bottom:9px;
}

.control{
  display:grid;
  grid-template-columns:60px 1fr 45px;
  align-items:center;
  gap:8px;
  margin:9px 0;
}

.control label{
  font-size:10px;
  color:#aaa;
}

.control span{
  color:#00d26a;
  font-size:10px;
  text-align:right;
}

input[type=range]{
  width:100%;
  accent-color:#00d26a;
}

input[type=color]{
  width:48px;
  height:38px;
  border:0;
  background:none;
}

.layer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  margin-bottom:6px;
  border-radius:9px;
  background:#22262d;
  font-size:11px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <button onclick="home()">←</button>

    <div>
      <div class="title">TTSS</div>
      <div class="subtitle">Professional Skin Editor</div>
    </div>

    <div>
      <button onclick="undo()">↶</button>
      <button onclick="redo()">↷</button>
      <button onclick="exportPNG()">💾</button>
    </div>

  </div>


  <div class="workspace" id="workspace">

    <div class="grid"></div>

    <canvas id="design"></canvas>

    <div class="zoom" id="zoomText">100%</div>

  </div>


  <div class="bottom">

    <div class="panel" id="panel">
      <div class="panel-inner" id="panelContent"></div>
    </div>


    <div class="tools">

      <button class="tool" onclick="textTool()">
        <b>T</b>
        Text
      </button>

      <button class="tool" onclick="stickerTool()">
        <b>🏷️</b>
        Sticker
      </button>

      <button class="tool" onclick="imageTool()">
        <b>🖼️</b>
        Image
      </button>

      <button class="tool" onclick="styleTool()">
        <b>✨</b>
        Style
      </button>

      <button class="tool" onclick="transformTool()">
        <b>🔄</b>
        Transform
      </button>

      <button class="tool" onclick="brushTool()">
        <b>🖌️</b>
        Brush
      </button>

      <button class="tool" onclick="eraserTool()">
        <b>🧽</b>
        Eraser
      </button>

      <button class="tool" onclick="layersTool()">
        <b>▱</b>
        Layers
      </button>

      <button class="tool" onclick="deleteObject()">
        <b>🗑️</b>
        Delete
      </button>

    </div>

  </div>

</div>


<input
id="imageInput"
type="file"
accept="image/*"
class="hidden"
>


<script>

/* =====================================
   CANVAS
===================================== */

const canvas =
document.getElementById("design");

const ctx =
canvas.getContext("2d");

const workspace =
document.getElementById("workspace");

let objects = [];

let selected = null;

let zoom = 1;

let history = [];

let historyPos = -1;

let mode = "select";

let drawing = false;

let brushColor = "#00d26a";

let brushSize = 8;

let dpr = window.devicePixelRatio || 1;


/* =====================================
   RESIZE CANVAS
===================================== */

function resizeCanvas(){

  const rect =
  canvas.getBoundingClientRect();

  canvas.width =
  rect.width * dpr;

  canvas.height =
  rect.height * dpr;

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  draw();

}

window.addEventListener(
  "resize",
  resizeCanvas
);

setTimeout(
  resizeCanvas,
  100
);


/* =====================================
   DRAW EVERYTHING
===================================== */

function draw(){

  const rect =
  canvas.getBoundingClientRect();

  const w = rect.width;
  const h = rect.height;

  ctx.clearRect(0,0,w,h);

  ctx.fillStyle="#252a30";
  ctx.fillRect(0,0,w,h);

  for(const o of objects){

    if(o.hidden) continue;

    drawObject(o);

  }

  if(selected){

    drawSelection(selected);

  }

}


/* =====================================
   DRAW OBJECT
===================================== */

function drawObject(o){

  ctx.save();

  ctx.translate(o.x,o.y);

  ctx.rotate(
    o.rotation * Math.PI / 180
  );

  ctx.scale(
    o.scale * o.flipX,
    o.scale * o.flipY
  );

  if(o.type==="text"){

    drawText(o);

  }

  else if(o.type==="image"){

    if(o.image){

      ctx.drawImage(
        o.image,
        -o.w/2,
        -o.h/2,
        o.w,
        o.h
      );

    }

  }

  else if(o.type==="brush"){

    drawStroke(o);

  }

  ctx.restore();

}


/* =====================================
   TEXT
===================================== */

function drawText(o){

  ctx.font =
  `${o.italic?"italic ":""}${o.bold?"900":"normal"} ${o.size}px Arial`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  let text=o.text;

  if(o.bend===0){

    drawTextEffects(
      o,
      text,
      0,
      0
    );

  }else{

    const chars =
    [...text];

    const radius =
    Math.max(
      100,
      500 - Math.abs(o.bend)*2
    );

    const total =
    Math.min(
      2.5,
      Math.abs(o.bend)/70
    );

    const start =
    -total/2;

    chars.forEach(
      (ch,i)=>{

        const t =
        chars.length===1
        ? .5
        : i/(chars.length-1);

        const angle =
        start + total*t;

        const x =
        Math.sin(angle)*radius;

        const y =
        (1-Math.cos(angle))*radius *
        (o.bend>0?1:-1);

        ctx.save();

        ctx.translate(
          x,
          y
        );

        ctx.rotate(angle);

        drawTextEffects(
          o,
          ch,
          0,
          0
        );

        ctx.restore();

      }
    );

  }

}


function drawTextEffects(
  o,
  text,
  x,
  y
){

  if(o.outline){

    ctx.lineWidth =
    o.outlineSize;

    ctx.strokeStyle =
    o.outlineColor;

    ctx.strokeText(
      text,x,y
    );

  }

  if(o.shadow){

    ctx.shadowColor =
    o.shadowColor;

    ctx.shadowBlur =
    o.shadowBlur;

    ctx.shadowOffsetX =
    o.shadowX;

    ctx.shadowOffsetY =
    o.shadowY;

  }

  ctx.fillStyle =
  o.color;

  ctx.fillText(
    text,x,y
  );

  ctx.shadowColor="transparent";
}


/* =====================================
   BRUSH
===================================== */

function drawStroke(o){

  if(!o.points.length)
    return;

  ctx.strokeStyle =
  o.color;

  ctx.lineWidth =
  o.size;

  ctx.lineCap="round";
  ctx.lineJoin="round";

  ctx.beginPath();

  ctx.moveTo(
    o.points[0].x,
    o.points[0].y
  );

  for(let i=1;i<o.points.length;i++){

    ctx.lineTo(
      o.points[i].x,
      o.points[i].y
    );

  }

  ctx.stroke();

}


/* =====================================
   SELECTION
===================================== */

function drawSelection(o){

  if(o.type==="brush")
    return;

  ctx.save();

  ctx.translate(o.x,o.y);

  ctx.rotate(
    o.rotation*Math.PI/180
  );

  const w =
  o.type==="text"
  ? Math.max(
      100,
      o.text.length*o.size*.55
    )
  : o.w;

  const h =
  o.type==="text"
  ? o.size*1.4
  : o.h;

  ctx.strokeStyle="#00d26a";
  ctx.lineWidth=1;
  ctx.setLineDash([5,5]);

  ctx.strokeRect(
    -w/2-8,
    -h/2-8,
    w+16,
    h+16
  );

  ctx.setLineDash([]);

  ctx.fillStyle="#00d26a";

  const points=[
    [-w/2-8,-h/2-8],
    [w/2+8,-h/2-8],
    [-w/2-8,h/2+8],
    [w/2+8,h/2+8]
  ];

  for(const p of points){

    ctx.beginPath();

    ctx.arc(
      p[0],
      p[1],
      5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.restore();

}


/* =====================================
   ADD TEXT
===================================== */

function addText(){

  const o={

    id:Date.now(),

    type:"text",

    text:"TANZANIA",

    x:canvas.clientWidth/2,

    y:canvas.clientHeight/2,

    size:42,

    color:"#ffffff",

    scale:1,

    rotation:0,

    flipX:1,

    flipY:1,

    bold:true,

    italic:false,

    outline:false,

    outlineColor:"#000000",

    outlineSize:3,

    shadow:false,

    shadowColor:"#000000",

    shadowBlur:5,

    shadowX:4,

    shadowY:4,

    bend:0

  };

  objects.push(o);

  selected=o;

  save();

  draw();

  textTool();

}


/* =====================================
   TEXT PANEL
===================================== */

function textTool(){

  mode="select";

  openPanel(`

    <div class="panel-title">
      TEXT STUDIO
    </div>

    <input
      type="text"
      id="textInput"
      value="${selected && selected.type==="text"
      ? escapeHTML(selected.text)
      : "TANZANIA"}"
      placeholder="Andika text..."
    >

    <div class="row">

      <button class="btn" onclick="addText()">
        ＋ New Text
      </button>

      <button class="btn" onclick="setBold()">
        B Bold
      </button>

      <button class="btn" onclick="setItalic()">
        I Italic
      </button>

      <button class="btn" onclick="setOutline()">
        Outline
      </button>

      <button class="btn" onclick="setShadow()">
        Shadow
      </button>

    </div>

    <div class="control">
      <label>Size</label>
      <input id="textSize"
      type="range"
      min="10"
      max="140"
      value="${selected?.size||42}">
      <span id="sizeValue">
      ${selected?.size||42}
      </span>
    </div>

    <div class="control">
      <label>Bend</label>
      <input id="bendRange"
      type="range"
      min="-120"
      max="120"
      value="${selected?.bend||0}">
      <span id="bendValue">
      ${selected?.bend||0}°
      </span>
    </div>

    <div class="row">

      <label style="font-size:11px">
        Color
      </label>

      <input
      id="textColor"
      type="color"
      value="${selected?.color||"#ffffff"}"
      >

    </div>

  `);

  const input =
  document.getElementById(
    "textInput"
  );

  input.oninput=()=>{

    if(!selected ||
       selected.type!=="text")
      return;

    selected.text =
    input.value;

    save(false);
    draw();

  };


  const size =
  document.getElementById(
    "textSize"
  );

  size.oninput=()=>{

    if(!selected) return;

    selected.size =
    Number(size.value);

    document.getElementById(
      "sizeValue"
    ).innerText =
    size.value;

    draw();

  };


  const bend =
  document.getElementById(
    "bendRange"
  );

  bend.oninput=()=>{

    if(!selected) return;

    selected.bend =
    Number(bend.value);

    document.getElementById(
      "bendValue"
    ).innerText =
    bend.value+"°";

    draw();

  };


  document.getElementById(
    "textColor"
  ).oninput=e=>{

    if(!selected) return;

    selected.color =
    e.target.value;

    draw();

  };

}


/* =====================================
   STYLES
===================================== */

function styleTool(){

  openPanel(`

    <div class="panel-title">
      TEXT STYLE
    </div>

    <div class="row">

      <button class="btn"
      onclick="setBold()">
      Bold
      </button>

      <button class="btn"
      onclick="setItalic()">
      Italic
      </button>

      <button class="btn"
      onclick="setOutline()">
      Outline
      </button>

      <button class="btn"
      onclick="setShadow()">
      Shadow
      </button>

      <button class="btn"
      onclick="style3D()">
      3D
      </button>

      <button class="btn"
      onclick="styleSticker()">
      Sticker
      </button>

      <button class="btn"
      onclick="resetStyle()">
      Reset
      </button>

    </div>

  `);

}


function setBold(){

  if(!selected ||
     selected.type!=="text")
    return;

  selected.bold =
  !selected.bold;

  draw();

}


function setItalic(){

  if(!selected ||
     selected.type!=="text")
    return;

  selected.italic =
  !selected.italic;

  draw();

}


function setOutline(){

  if(!selected ||
     selected.type!=="text")
    return;

  selected.outline =
  !selected.outline;

  draw();

}


function setShadow(){

  if(!selected ||
     selected.type!=="text")
    return;

  selected.shadow =
  !selected.shadow;

  draw();

}


function style3D(){

  if(!selected ||
     selected.type!=="text")
    return;

  selected.shadow=true;
  selected.shadowBlur=0;
  selected.shadowX=6;
  selected.shadowY=6;
  selected.shadowColor="#000";

  draw();

}


function styleSticker(){

  if(!selected ||
     selected.type!=="text")
    return;

  selected.outline=true;
  selected.outlineSize=7;
  selected.outlineColor="#ffffff";

  selected.shadow=true;
  selected.shadowBlur=0;
  selected.shadowX=4;
  selected.shadowY=4;

  draw();

}


function resetStyle(){

  if(!selected ||
     selected.type!=="text")
    return;

  selected.bold=true;
  selected.italic=false;
  selected.outline=false;
  selected.shadow=false;
  selected.outlineSize=3;

  draw();

}


/* =====================================
   STICKERS
===================================== */

function stickerTool(){

  openPanel(`

    <div class="panel-title">
      STICKER LIBRARY
    </div>

    <div class="row">

      <button class="btn"
      onclick="addSticker('🇹🇿')">
      🇹🇿 Tanzania
      </button>

      <button class="btn"
      onclick="addSticker('SCANIA')">
      SCANIA
      </button>

      <button class="btn"
      onclick="addSticker('V8')">
      V8
      </button>

      <button class="btn"
      onclick="addSticker('VOLVO')">
      VOLVO
      </button>

      <button class="btn"
      onclick="addSticker('FH16')">
      FH16
      </button>

      <button class="btn"
      onclick="addSticker('MAN')">
      MAN
      </button>

      <button class="btn"
      onclick="addSticker('DAF')">
      DAF
      </button>

      <button class="btn"
      onclick="addSticker('LOGISTICS')">
      LOGISTICS
      </button>

    </div>

  `);

}


function addSticker(text){

  const o={

    id:Date.now(),

    type:"text",

    text:text,

    x:canvas.clientWidth/2,

    y:canvas.clientHeight/2,

    size:30,

    color:"#ffffff",

    scale:1,

    rotation:0,

    flipX:1,

    flipY:1,

    bold:true,

    italic:false,

    outline:true,

    outlineColor:"#000000",

    outlineSize:4,

    shadow:true,

    shadowColor:"#000",

    shadowBlur:3,

    shadowX:3,

    shadowY:3,

    bend:0

  };

  objects.push(o);

  selected=o;

  save();

  draw();

}


/* =====================================
   IMAGE
===================================== */

function imageTool(){

  document
  .getElementById("imageInput")
  .click();

}


document
.getElementById("imageInput")
.addEventListener(
"change",
function(e){

  const file =
  e.target.files[0];

  if(!file) return;

  const img =
  new Image();

  img.onload=()=>{

    const o={

      id:Date.now(),

      type:"image",

      image:img,

      x:canvas.clientWidth/2,

      y:canvas.clientHeight/2,

      w:220,

      h:150,

      scale:1,

      rotation:0,

      flipX:1,

      flipY:1

    };

    objects.push(o);

    selected=o;

    save();

    draw();

  };

  img.src =
  URL.createObjectURL(file);

});


/* =====================================
   TRANSFORM PANEL
===================================== */

function transformTool(){

  openPanel(`

    <div class="panel-title">
      TRANSFORM
    </div>

    <div class="control">
      <label>Scale</label>
      <input id="scaleRange"
      type="range"
      min=".2"
      max="3"
      step=".05"
      value="${selected?.scale||1}">
      <span id="scaleValue">
      ${Math.round((selected?.scale||1)*100)}%
      </span>
    </div>

    <div class="control">
      <label>Rotate</label>
      <input id="rotateRange"
      type="range"
      min="-180"
      max="180"
      value="${selected?.rotation||0}">
      <span id="rotateValue">
      ${selected?.rotation||0}°
      </span>
    </div>

    <div class="control">
      <label>Opacity</label>
      <input id="opacityRange"
      type="range"
      min="0"
      max="1"
      step=".05"
      value="${selected?.opacity??1}">
      <span id="opacityValue">
      ${Math.round((selected?.opacity??1)*100)}%
      </span>
    </div>

    <div class="row">

      <button class="btn"
      onclick="flipHorizontal()">
      ↔ Flip
      </button>

      <button class="btn"
      onclick="flipVertical()">
      ↕ Flip
      </button>

      <button class="btn"
      onclick="centerObject()">
      Center
      </button>

    </div>

  `);


  document.getElementById(
    "scaleRange"
  ).oninput=e=>{

    if(!selected)return;

    selected.scale =
    Number(e.target.value);

    document.getElementById(
      "scaleValue"
    ).innerText =
    Math.round(
      selected.scale*100
    )+"%";

    draw();

  };


  document.getElementById(
    "rotateRange"
  ).oninput=e=>{

    if(!selected)return;

    selected.rotation =
    Number(e.target.value);

    document.getElementById(
      "rotateValue"
    ).innerText =
    selected.rotation+"°";

    draw();

  };


  document.getElementById(
    "opacityRange"
  ).oninput=e=>{

    if(!selected)return;

    selected.opacity =
    Number(e.target.value);

    document.getElementById(
      "opacityValue"
    ).innerText =
    Math.round(
      selected.opacity*100
    )+"%";

    draw();

  };

}


function flipHorizontal(){

  if(!selected)return;

  selected.flipX *= -
