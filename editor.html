  margin:0;
  padding:0;

html,body{

}

}

.app{

/* TOP BAR */

.top{
  height:56px;

  border-bottom:1px solid #292e35;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 7px;
  z-index:20;
}

.top-left,

  align-items:center;
  gap:2px;
}

.top button{

  background:transparent;
  border-radius:10px;

}

.subtitle{

  margin-top:2px;
}

/* WORKSPACE */

.workspace{
  flex:1;
  position:relative;
  overflow:hidden;
  background:#090a0c;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
}

.grid{
  position:absolute;
  inset:0;
  opacity:.06;
  background-image:
    linear-gradient(#fff 1px,transparent 1px),
    linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:25px 25px;
  pointer-events:none;
}

/* STAGE */

.stage{
  position:relative;
  width:min(94vw,900px);
  aspect-ratio:16/9;
  background:#292e34;
  box-shadow:0 20px 60px #000;
  transform-origin:center;
  touch-action:none;
}

#canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

/* ZOOM */

.zoom{
  position:absolute;
  left:10px;
  bottom:10px;
  background:#000c;
  color:#aaa;
  font-size:10px;
  padding:7px 10px;
  border-radius:8px;
  z-index:5;
}

/* PANEL */

.panel{
  background:#15181d;
  border-top:1px solid #292e35;
  max-height:0;
  overflow:hidden;
  transition:max-height .2s ease;
  z-index:15;
}

.panel.open{
  max-height:250px;
  overflow-y:auto;
}

.panel-content{
  padding:12px;
}

.panel-title{
  font-size:11px;
  font-weight:bold;
  margin-bottom:10px;
  color:#ddd;
}

.row{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:9px;
}

.row::-webkit-scrollbar{
  display:none;
}

.btn{
  flex:0 0 auto;
  padding:10px 13px;
  border:1px solid #393f48;
  border-radius:10px;
  background:#242930;
  font-size:11px;
}

.btn:active{

input[type=text]{

@media(min-width:800px){

<script>

/* =====================================================
   TTSS SKIN EDITOR
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const stage =
  document.getElementById("stage");

const workspace =
  document.getElementById("workspace");

let objects = [];

let selected = null;

let mode = "select";

let drawing = false;

let currentStroke = null;

let gesture = null;

let zoomLevel = 1;

let pinchDistance = 0;

let pinchStartZoom = 1;

let brushSize = 8;

let brushColor = "#00d26a";

let history = [];

let historyIndex = -1;

const dpr =
  window.devicePixelRatio || 1;


/* =====================================================
   CANVAS SIZE
===================================================== */

function resizeCanvas(){

  const rect =
    stage.getBoundingClientRect();

  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  canvas.style.width =
    rect.width + "px";

  canvas.style.height =
    rect.height + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  draw();

}

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =====================================================
   DRAW
===================================================== */

function draw(){

  const width =
    canvas.clientWidth;

  const height =
    canvas.clientHeight;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  /* background */

  ctx.fillStyle =
    "#292e34";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /* objects */

  for(const object of objects){

    if(object.hidden)
      continue;

    ctx.save();

    ctx.globalAlpha =
      object.opacity ?? 1;

    if(object.type === "text"){

      drawText(object);

    }

    else if(object.type === "image"){

      drawImage(object);

    }

    else if(object.type === "brush"){

      drawBrush(object);

    }

    ctx.restore();

  }


  /* selection */

  if(selected){

    drawSelection(selected);

  }

}


/* =====================================================
   TEXT
===================================================== */

function drawText(object){

  ctx.save();

  ctx.translate(
    object.x,
    object.y
  );

  ctx.rotate(
    object.rotation *
    Math.PI / 180
  );

  ctx.scale(
    object.scale * object.flipX,
    object.scale * object.flipY
  );

  ctx.font =
    `${object.italic ? "italic " : ""}` +
    `${object.bold ? "900" : "normal"} ` +
    `${object.size}px Arial`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";


  if(object.bend === 0){

    paintText(
      object,
      object.text,
      0,
      0
    );

  }

  else{

    const chars =
      [...object.text];

    const radius = 300;

    const amount =
      object.bend / 100;

    const spread =
      Math.min(
        2.2,
        Math.abs(amount) * 1.8
      );

    chars.forEach(
      (char,index)=>{

        const t =
          chars.length === 1
          ? .5
          : index /
            (chars.length - 1);

        const angle =
          -spread / 2 +
          spread * t;

        const x =
          Math.sin(angle) *
          radius;

        const y =
          (1 - Math.cos(angle)) *
          radius *
          (amount > 0 ? 1 : -1);

        ctx.save();

        ctx.translate(
          x,
          y
        );

        ctx.rotate(angle);

        paintText(
          object,
          char,
          0,
          0
        );

        ctx.restore();

      }
    );

  }

  ctx.restore();

}


/* =====================================================
   TEXT PAINT
===================================================== */

function paintText(
  object,
  text,
  x,
  y
){

  if(object.outline){

    ctx.lineWidth =
      object.outlineSize;

    ctx.strokeStyle =
      object.outlineColor;

    ctx.strokeText(
      text,
      x,
      y
    );

  }


  if(object.shadow){

    ctx.shadowColor =
      object.shadowColor;

    ctx.shadowBlur =
      object.shadowBlur;

    ctx.shadowOffsetX =
      object.shadowX;

    ctx.shadowOffsetY =
      object.shadowY;

  }


  ctx.fillStyle =
    object.color;

  ctx.fillText(
    text,
    x,
    y
  );


  ctx.shadowColor =
    "transparent";

}


/* =====================================================
   IMAGE
===================================================== */

function drawImage(object){

  if(!object.image)
    return;

  ctx.save();

  ctx.translate(
    object.x,
    object.y
  );

  ctx.rotate(
    object.rotation *
    Math.PI / 180
  );

  ctx.scale(
    object.scale * object.flipX,
    object.scale * object.flipY
  );

  ctx.drawImage(
    object.image,
    -object.w / 2,
    -object.h / 2,
    object.w,
    object.h
  );

  ctx.restore();

}


/* =====================================================
   BRUSH
===================================================== */

function drawBrush(object){

  if(
    !object.points ||
    object.points.length === 0
  ){

    return;

  }


  ctx.strokeStyle =
    object.color;

  ctx.lineWidth =
    object.size;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.beginPath();

  ctx.moveTo(
    object.points[0].x,
    object.points[0].y
  );


  for(
    let i = 1;
    i < object.points.length;
    i++
  ){

    ctx.lineTo(
      object.points[i].x,
      object.points[i].y
    );

  }

  ctx.stroke();

}


/* =====================================================
   OBJECT BOUNDS
===================================================== */

function bounds(object){

  if(object.type === "text"){

    return {

      w:Math.max(
        100,
        object.text.length *
        object.size *
        .55
      ),

      h:
        object.size * 1.4

    };

  }


  if(object.type === "image"){

    return {

      w:object.w,

      h:object.h

    };

  }


  return {
    w:0,
    h:0
  };

}


/* =====================================================
   SELECTION BOX
===================================================== */

function drawSelection(object){

  if(object.type === "brush")
    return;

  const b =
    bounds(object);

  ctx.save();

  ctx.translate(
    object.x,
    object.y
  );

  ctx.rotate(
    object.rotation *
    Math.PI / 180
  );


  /* box */

  ctx.strokeStyle =
    "#00d26a";

  ctx.lineWidth = 2;

  ctx.setLineDash([
    5,
    4
  ]);

  ctx.strokeRect(
    -b.w / 2 - 8,
    -b.h / 2 - 8,
    b.w + 16,
    b.h + 16
  );

  ctx.setLineDash([]);


  /* corners */

  const handles = [

    [
      -b.w / 2 - 8,
      -b.h / 2 - 8
    ],

    [
      b.w / 2 + 8,
      -b.h / 2 - 8
    ],

    [
      b.w / 2 + 8,
      b.h / 2 + 8
    ],

    [
      -b.w / 2 - 8,
      b.h / 2 + 8
    ]

  ];


  ctx.fillStyle =
    "#00d26a";


  handles.forEach(
    point=>{

      ctx.beginPath();

      ctx.arc(
        point[0],
        point[1],
        6,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }
  );


  /* rotation line */

  ctx.strokeStyle =
    "#00d26a";

  ctx.beginPath();

  ctx.moveTo(
    0,
    -b.h / 2 - 8
  );

  ctx.lineTo(
    0,
    -b.h / 2 - 42
  );

  ctx.stroke();


  /* rotation handle */

  ctx.beginPath();

  ctx.arc(
    0,
    -b.h / 2 - 48,
    7,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();

}


/* =====================================================
   POINTER POSITION
===================================================== */

function getPoint(event){

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:
      event.clientX -
      rect.left,

    y:
      event.clientY -
      rect.top

  };

}


/* =====================================================
   FIND OBJECT
===================================================== */

function findObject(point){

  for(
    let i = objects.length - 1;
    i >= 0;
    i--
  ){

    const object =
      objects[i];

    if(
      object.hidden ||
      object.type === "brush"
    ){

      continue;

    }


    const b =
      bounds(object);


    if(

      point.x >=
      object.x - b.w / 2 &&

      point.x <=
      object.x + b.w / 2 &&

      point.y >=
      object.y - b.h / 2 &&

      point.y <=
      object.y + b.h / 2

    ){

      return object;

    }

  }

  return null;

}


/* =====================================================
   HANDLE ACTION
===================================================== */

function getHandleAction(
  point,
  object
){

  if(object.type === "brush")
    return null;


  const b =
    bounds(object);


  const dx =
    point.x - object.x;

  const dy =
    point.y - object.y;


  const angle =
    -object.rotation *
    Math.PI / 180;


  const localX =
    dx * Math.cos(angle) -
    dy * Math.sin(angle);


  const localY =
    dx * Math.sin(angle) +
    dy * Math.cos(angle);


  /* ROTATE */

  const rotateY =
    -b.h / 2 - 48;


  const rotateDistance =
    Math.sqrt(

      localX * localX +

      (localY - rotateY) *
      (localY - rotateY)

    );


  if(
    rotateDistance < 20
  ){

    return "rotate";

  }


  /* RESIZE */

  const cornerX =
    b.w / 2 + 8;

  const cornerY =
    b.h / 2 + 8;


  const resizeDistance =
    Math.sqrt(

      (localX - cornerX) *
      (localX - cornerX) +

      (localY - cornerY) *
      (localY - cornerY)

    );


  if(
    resizeDistance < 24
  ){

    return "resize";

  }


  return "move";

}


/* =====================================================
   POINTER DOWN
===================================================== */

canvas.addEventListener(
  "pointerdown",
  event=>{

    event.preventDefault();

    canvas.setPointerCapture(
      event.pointerId
    );


    const point =
      getPoint(event);


    /* BRUSH */

    if(mode === "brush"){

      drawing = true;

      currentStroke = {

        id:Date.now(),

        type:"brush",

        points:[point],

        color:brushColor,

        size:brushSize,

        opacity:1

      };


      objects.push(
        currentStroke
      );

      draw();

      return;

    }


    /* ERASER */

    if(mode === "eraser"){

      drawing = true;

      erase(point);

      return;

    }


    /* SELECT */

    const hit =
      findObject(point);


    if(hit){

      selected = hit;

      const action =
        getHandleAction(
          point,
          selected
        );


      /* ROTATE */

      if(action === "rotate"){

        gesture = {

          type:"rotate",

          centerX:selected.x,

          centerY:selected.y,

          startRotation:
            selected.rotation

        };

      }


      /* RESIZE */

      else if(
        action === "resize"
      ){

        gesture = {

          type:"resize",

          startX:point.x,

          startY:point.y,

          startScale:
            selected.scale

        };

      }


      /* MOVE */

      else{

        gesture = {

          type:"move",

          startX:point.x,

          startY:point.y,

          objectX:selected.x,

          objectY:selected.y

        };

      }

    }

    else{

      selected = null;

      gesture = null;

    }


    draw();

  }
);


/* =====================================================
   POINTER MOVE
===================================================== */

canvas.addEventListener(
  "pointermove",
  event=>{

    event.preventDefault();


    const point =
      getPoint(event);


    /* BRUSH */

    if(
      mode === "brush" &&
      drawing &&
      currentStroke
    ){

      currentStroke.points.push(
        point
      );

      draw();

      return;

    }


    /* ERASER */

    if(
      mode === "eraser" &&
      drawing
    ){

      erase(point);

      return;

    }


    if(
      !gesture ||
      !selected
    ){

      return;

    }


    /* MOVE */

    if(
      gesture.type === "move"
    ){

      selected.x =
        gesture.objectX +
        (
          point.x -
          gesture.startX
        );


      selected.y =
        gesture.objectY +
        (
          point.y -
          gesture.startY
        );

    }


    /* RESIZE */

    if(
      gesture.type === "resize"
    ){

      const dx =
        point.x -
        gesture.startX;

      const dy =
        point.y -
        gesture.startY;


      const change =
        (dx + dy) / 300;


      selected.scale =
        Math.max(
          .15,
          Math.min(
            5,
            gesture.startScale +
            change
          )
        );

    }


    /* ROTATE */

    if(
      gesture.type === "rotate"
    ){

      const angle =
        Math.atan2(

          point.y -
          gesture.centerY,

          point.x -
          gesture.centerX

        ) *
        180 /
        Math.PI;


      selected.rotation =
        angle + 90;

    }


    draw();

  }
);


/* =====================================================
   POINTER UP
===================================================== */

canvas.addEventListener(
  "pointerup",
  event=>{

    try{

      canvas.releasePointerCapture(
        event.pointerId
      );

    }catch(e){}


    if(gesture){

      save();

      gesture = null;

    }


    if(drawing){

      drawing = false;

      currentStroke = null;

      save();

    }

  }
);


canvas.addEventListener(
  "pointercancel",
  ()=>{

    gesture = null;

    drawing = false;

    currentStroke = null;

  }
);

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const stage=document.getElementById("stage");

let objects=[];
let selected=null;

let mode="select";

let zoomLevel=1;

let history=[];
let historyIndex=-1;

let brushSize=8;
let brushColor="#00d26a";

let drawing=false;
let currentStroke=null;

let dpr=window.devicePixelRatio||1;


/* =========================
CANVAS
========================= */

function resize(){

  const r=stage.getBoundingClientRect();

  canvas.width=r.width*dpr;
  canvas.height=r.height*dpr;

  canvas.style.width=r.width+"px";
  canvas.style.height=r.height+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  draw();

}

window.addEventListener("resize",resize);

setTimeout(resize,100);


/* =========================
DRAW
========================= */

function draw(){

  const r=stage.getBoundingClientRect();
  const w=r.width;
  const h=r.height;

  ctx.clearRect(0,0,w,h);

  ctx.fillStyle="#262b31";
  ctx.fillRect(0,0,w,h);

  for(const o of objects){

    if(o.hidden)continue;

    ctx.save();

    ctx.globalAlpha=o.opacity??1;

    if(o.type==="text")drawText(o);

    if(o.type==="image")drawImage(o);

    if(o.type==="brush")drawBrush(o);

    ctx.restore();

  }

  if(selected){
    drawHandles(selected);
  }

}


/* =========================
TEXT
========================= */

function drawText(o){

  ctx.save();

  ctx.translate(o.x,o.y);

  ctx.rotate(
    o.rotation*Math.PI/180
  );

  ctx.scale(
    o.scale*o.flipX,
    o.scale*o.flipY
  );

  ctx.font=
  `${o.italic?"italic ":""}${o.bold?"900":"normal"} ${o.size}px Arial`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  if(o.bend===0){

    paintText(o,o.text,0,0);

  }else{

    const chars=[...o.text];

    const radius=300;

    const amount=
      o.bend/100;

    const spread=
      Math.min(2.2,Math.abs(amount)*1.8);

    chars.forEach((ch,i)=>{

      const t=
        chars.length===1
        ? .5
        : i/(chars.length-1);

      const angle=
        -spread/2+
        spread*t;

      const x=
        Math.sin(angle)*radius;

      const y=
        (1-Math.cos(angle))*
        radius*
        (amount>0?1:-1);

      ctx.save();

      ctx.translate(x,y);
      ctx.rotate(angle);

      paintText(o,ch,0,0);

      ctx.restore();

    });

  }

  ctx.restore();

}


function paintText(o,text,x,y){

  if(o.outline){

    ctx.lineWidth=o.outlineSize;
    ctx.strokeStyle=o.outlineColor;

    ctx.strokeText(text,x,y);

  }

  if(o.shadow){

    ctx.shadowColor=o.shadowColor;
    ctx.shadowBlur=o.shadowBlur;
    ctx.shadowOffsetX=o.shadowX;
    ctx.shadowOffsetY=o.shadowY;

  }

  ctx.fillStyle=o.color;
  ctx.fillText(text,x,y);

  ctx.shadowColor="transparent";

}


/* =========================
IMAGE
========================= */

function drawImage(o){

  if(!o.image)return;

  ctx.save();

  ctx.translate(o.x,o.y);

  ctx.rotate(o.rotation*Math.PI/180);

  ctx.scale(
    o.scale*o.flipX,
    o.scale*o.flipY
  );

  ctx.drawImage(
    o.image,
    -o.w/2,
    -o.h/2,
    o.w,
    o.h
  );

  ctx.restore();

}


/* =========================
BRUSH
========================= */

function drawBrush(o){

  if(o.points.length<1)return;

  ctx.strokeStyle=o.color;
  ctx.lineWidth=o.size;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  ctx.beginPath();

  ctx.moveTo(
    o.points[0].x,
    o.points[0].y
  );

  for(let i=1;i<o.points.length;i++){

    ctx.lineTo(
      o.points[i].x,
      o.points[i].y
    );

  }

  ctx.stroke();

}


/* =========================
SELECTION + HANDLES
========================= */

function bounds(o){

  let w;
  let h;

  if(o.type==="text"){

    w=Math.max(
      100,
      o.text.length*o.size*.55
    );

    h=o.size*1.4;

  }else{

    w=o.w;
    h=o.h;

  }

  return {w,h};

}


function drawHandles(o){

  if(o.type==="brush")return;

  const b=bounds(o);

  ctx.save();

  ctx.translate(o.x,o.y);

  ctx.rotate(
    o.rotation*Math.PI/180
  );

  ctx.strokeStyle="#00d26a";
  ctx.lineWidth=2;
  ctx.setLineDash([5,4]);

  ctx.strokeRect(
    -b.w/2-8,
    -b.h/2-8,
    b.w+16,
    b.h+16
  );

  ctx.setLineDash([]);

  const handles=[
    [-b.w/2-8,-b.h/2-8],
    [b.w/2+8,-b.h/2-8],
    [b.w/2+8,b.h/2+8],
    [-b.w/2-8,b.h/2+8]
  ];

  ctx.fillStyle="#00d26a";

  handles.forEach(p=>{

    ctx.beginPath();

    ctx.arc(
      p[0],
      p[1],
      6,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  /* rotation handle */

  ctx.strokeStyle="#00d26a";
  ctx.beginPath();

  ctx.moveTo(
    0,
    -b.h/2-8
  );

  ctx.lineTo(
    0,
    -b.h/2-42
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    0,
    -b.h/2-48,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =========================
POINTER
========================= */

let gesture=null;

canvas.addEventListener(
"pointerdown",
e=>{

  const p=point(e);

  if(mode==="brush"){

    drawing=true;

    currentStroke={
      id:Date.now(),
      type:"brush",
      points:[p],
      color:brushColor,
      size:brushSize
    };

    objects.push(currentStroke);

    draw();

    return;

  }

  if(mode==="eraser"){

    drawing=true;

    erase(p);

    return;

  }

  const hit=findObject(p);

  if(hit){

    selected=hit;

    gesture={
      type:"move",
      startX:p.x,
      startY:p.y,
      objectX:hit.x,
      objectY:hit.y
    };

  }else{

    selected=null;

  }

  draw();

});


canvas.addEventListener(
"pointermove",
e=>{

  if(!drawing&&
     !gesture)return;

  const p=point(e);

  if(mode==="brush"){

    currentStroke.points.push(p);

    draw();

    return;

  }

  if(mode==="eraser"){

    erase(p);

    return;

  }

  if(gesture&&
     gesture.type==="move"){

    selected.x=
      gesture.objectX+
      (p.x-gesture.startX);

    selected.y=
      gesture.objectY+
      (p.y-gesture.startY);

    draw();

  }

});


canvas.addEventListener(
"pointerup",
()=>{

  if(drawing){

    drawing=false;

    currentStroke=null;

    save();

  }

  if(gesture){

    save();

    gesture=null;

  }

});


function point(e){

  const r=
    canvas.getBoundingClientRect();

  return{
    x:e.clientX-r.left,
    y:e.clientY-r.top
  };

}


/* =========================
FIND OBJECT
========================= */

function findObject(p){

  for(let i=objects.length-1;i>=0;i--){

    const o=objects[i];

    if(o.type==="brush")continue;

    const b=bounds(o);

    if(
      p.x>=o.x-b.w/2 &&
      p.x<=o.x+b.w/2 &&
      p.y>=o.y-b.h/2 &&
      p.y<=o.y+b.h/2
    ){

      return o;

    }

  }

  return null;

}
